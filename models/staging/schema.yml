
version: 2

models:
  - name: stg_customers__sample_dataset
    description: "Customers from T_SAMPLE_DATASET"
    columns:
      - name: unique_raw_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
      - name: first_name
      - name: last_name
      - name: full_name
      - name: gender
        data_tests:
          - accepted_values:
              values: ['F', 'M', 'UNKNOWN']

